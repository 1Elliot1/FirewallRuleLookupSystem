# ruff.toml  (repo root)

[tool.ruff]
select = ["E", "F"]         # keep all the usual lint rules

[tool.ruff.per-file-ignores]
# Globs are relative to the repo root.
# Here we silence lambda-assign (E731) and unused-import (F401)
# only for any file under app/tests/
"app/tests/*.py" = ["E731", "F401"]
